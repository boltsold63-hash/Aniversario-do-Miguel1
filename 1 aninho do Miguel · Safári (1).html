<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1 aninho do Miguel · Safári</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--brown:#4a2a12;--green:#3f7a2b;--orange:#e5802a;--cream:#fff5d6;--rope:#a9772f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--brown);background:#e9f0c4}
.wrap{max-width:480px;margin:0 auto;background:#fdf3d8}
.art img{display:block;width:100%;height:auto}
.stage{position:relative;overflow:hidden;padding:44px 18px 36px;background:radial-gradient(circle at 0 0,#bcd98a 0,transparent 45%),radial-gradient(circle at 100% 100%,#bcd98a 0,transparent 50%),linear-gradient(#fdf3d8,#eef2c8)}
.leaf{position:absolute;width:120px;opacity:.5;pointer-events:none}
.l1{left:-30px;top:30px;transform:rotate(-30deg)}.l2{right:-34px;bottom:20px;transform:rotate(150deg)}.l3{right:-20px;top:260px;width:90px;transform:rotate(-100deg)}
.plank{position:relative;margin:0 auto 38px;padding:22px 18px;border-radius:22px;border:3px solid var(--cream);
 background:repeating-linear-gradient(90deg,#7a461408 0 2px,transparent 2px 11px),linear-gradient(#f7e2b0,#e8c585);
 box-shadow:0 0 0 3px #c99a55,0 12px 18px #5a3a1a40}
.plank::before,.plank::after{content:"";position:absolute;top:-30px;width:7px;height:30px;background:repeating-linear-gradient(#a9772f 0 4px,#7e5520 4px 6px);border-radius:3px}
.plank::before{left:22%}.plank::after{right:22%}
.plank h2{margin:0 0 14px;text-align:center;font-size:30px;line-height:1.05;font-weight:700;color:var(--brown)}
.row{display:flex;gap:12px;align-items:center;background:#fff5d6b3;border-radius:16px;padding:12px;margin-bottom:10px}
.row .i{flex:none;width:46px;height:46px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 3px var(--cream)}
.row b{display:block;font-size:19px;font-weight:600}.row small{display:block;font-size:16px;font-weight:500;line-height:1.25}
a.map{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:999px;background:var(--orange);color:#fff;font-weight:600;font-size:16px;text-decoration:none;border:2px solid var(--cream);box-shadow:0 3px 0 #a55410}
.sub{margin:-6px 0 16px;text-align:center;font-size:17px;font-weight:500}
label{display:block;margin:0 0 6px 6px;font-weight:600;font-size:17px}
input{width:100%;font:inherit;font-size:19px;padding:14px 18px;border-radius:999px;border:3px solid var(--rope);background:#fffaf0;color:var(--brown);box-shadow:inset 0 3px 6px #7a461433}
input::placeholder{color:#a58b6a}
input:focus-visible,button:focus-visible,a:focus-visible{outline:4px solid var(--orange);outline-offset:3px}
button{width:100%;margin-top:16px;font:inherit;font-size:21px;font-weight:700;letter-spacing:.2px;padding:16px;border-radius:999px;border:3px solid var(--cream);color:#fff;cursor:pointer;
 background:linear-gradient(#6fb23c,#3f7a2b);box-shadow:0 0 0 3px #2f5f20,0 7px 0 #2f5f20,0 12px 16px #0003;text-shadow:0 2px 0 #2f5f20}
button:active{transform:translateY(5px);box-shadow:0 0 0 3px #2f5f20,0 2px 0 #2f5f20}
.err{min-height:24px;margin-top:12px;text-align:center;color:#a21d1d;font-weight:600}
.ok{display:none;text-align:center}
.ok .check{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--green);color:#fff;font-size:46px;display:grid;place-items:center;box-shadow:0 0 0 5px var(--cream),0 0 0 8px #2f5f20;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.ok p{margin:0 0 14px;font-size:18px;font-weight:500}
.ok a{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--cream);color:var(--brown);font-weight:600;text-decoration:none;box-shadow:0 0 0 3px #c99a55}
.foot{text-align:center;font-weight:600;font-size:18px;margin:0}
@media(prefers-reduced-motion:reduce){.ok .check{animation:none}}
</style></head><body><div class="wrap">
